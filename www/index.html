function step(s){let i=keys.indexOf(cur);i=i<0?0:Math.min(keys.length-1,Math.max(0,i+s));$("q").value=keys[i];show(keys[i])}

const FL=[["النوع",0],["رقم البوررينج BH",1],["سقف السطح العلوي",2],["سقف الرووف",3],["سقف الأول",4],["منسوب الأرض (تشطيب)",5],["منسوب المنصة",6],["ظهر الميدة",7],["منسوب التأسيس",8],["عمق الميدة",9],["سمك الخرسانة المسلحة",10],["سمك الخرسانة العادية",11],["سمك الاستبدال",12],["منسوب المياه",13],["منسوب الحفر",14]];
const sv=()=>{try{localStorage.setItem("data",JSON.stringify(D))}catch(e){}};
function pr(t){
 if(t.length<12||!/^V\d+$/.test(t[t.length-1])||!/^\d+\.\d+$/.test(t[0]))return null;
 const vid=t[t.length-3],typ=t[t.length-2];if(!/^\d+A?$/.test(vid))return null;
 const n=[];let bh="";t.slice(0,-3).forEach(x=>{if(/^\d+(\.\d+)?$/.test(x))n.push(+x);else bh=x});
 if(n.length<10)return null;
 const [up,rf,fl,gf,fpl,tocf,fnd,gb,rc,pc]=n;const r=n.slice(10);let exc=null,repl=null,fe=0;
 if(r.length&&r[r.length-1]>=5){exc=r.pop();repl=+(fnd-exc).toFixed(2)}
 else if(r.length&&!(r.length==1&&r[0]==0.3))repl=r[0];
 if(repl==null&&exc==null)repl=0;
 if(exc==null){exc=+(fnd-repl).toFixed(2);fe=1}
 return [vid,[typ,bh,up,rf,fl,gf,fpl,tocf,fnd,gb,rc,pc,repl,0.3,exc,fe]];
}
function lp(){return new Promise((ok,no)=>{if(window.pdfjsLib)return ok();const s=document.createElement("script");s.src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";s.onload=()=>{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";ok()};s.onerror=()=>no(new Error("net"));document.head.appendChild(s)})}
async function parsePdf(buf){
 await lp();const pdf=await pdfjsLib.getDocument({data:buf}).promise;const out={};
 for(let i=1;i<=pdf.numPages;i++){const tc=await (await pdf.getPage(i)).getTextContent();const rows=[];
  tc.items.forEach(it=>{const w=it.str.trim();if(!w)return;const y=Math.round(it.transform[5]);let r=rows.find(r=>Math.abs(r.y-y)<=2);if(!r){r={y,a:[]};rows.push(r)}r.a.push([it.transform[4],w])});
  rows.forEach(r=>{const t=r.a.sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(" ").split(/\s+/);const o=pr(t);if(o)out[o[0]]=o[1]})}
 return out}
function closeSet(){$("sp").style.display="none"}
function openSet(edit){
 const p=$("sp");p.style.display="block";const src=localStorage.getItem("src");
 let h=`<h2>⚙️ الإعدادات</h2><p class="note">عدد الفلل: ${keys.length} — ${src?"المصدر: "+src:"البيانات الأصلية"}</p>
 <label class="bt">📄 استيراد PDF جديد (بيستبدل الحالي)<input id="pf" type="file" accept="application/pdf" hidden></label>
 <button class="bt" id="ed">✏️ تعديل / إضافة فيلا</button><button class="bt" id="rs">↩️ رجوع للبيانات الأصلية</button>`;
 if(edit){const d=D[cur]||[];h+=`<h3>رقم الفيلا (اكتب رقم جديد للإضافة)</h3><input class="fi" id="f_id" value="${cur||""}" style="direction:ltr">`+FL.map(([n,i])=>`<h3>${n}</h3><input class="fi" id="f${i}" value="${d[i]==null?"":d[i]}" ${i<2?"":"inputmode=decimal"} style="direction:ltr">`).join("")+`<button class="bt" id="sv" style="background:var(--acc);color:#000">💾 حفظ</button>`}
 h+=`<button class="bt" id="cl" style="background:#64798a">إغلاق</button>`;p.innerHTML=h;
 $("cl").onclick=closeSet;$("ed").onclick=()=>openSet(true);
 $("rs").onclick=()=>{if(!confirm("ترجع للبيانات الأصلية؟ كل تعديلاتك هتتمسح."))return;D=JSON.parse(BASE);localStorage.removeItem("data");localStorage.removeItem("src");rk();closeSet();show(cur);toast("اتسترجعت ✅")};
 $("pf").onchange=async e=>{const f=e.target.files[0];if(!f)return;toast("بقرا الملف...");
  try{const o=await parsePdf(await f.arrayBuffer());const n=Object.keys(o).length;
   if(!n){toast("مالقيتش صفوف مناسيب في الملف");return}
   if(!confirm("لقيت "+n+" فيلا. أستبدل البيانات الحالية؟"))return;
   D=o;localStorage.setItem("src",f.name);sv();rk();closeSet();$("q").value="";show("");toast("تم الاستيراد ✅ "+n+" فيلا")}
  catch(x){toast("فشل: محتاج إنترنت أو الملف مش مناسب")}};
 if(edit)$("sv").onclick=()=>{const id=$("f_id").value.trim().toUpperCase();if(!id){toast("اكتب رقم الفيلا");return}
  const a=[];for(const [n,i] of FL){const v=$("f"+i).value.trim();if(i<2)a[i]=v;else{a[i]=v===""?null:parseFloat(v);if(v!==""&&isNaN(a[i])){toast("رقم غلط في: "+n);return}}}
  a[13]=a[13]==null?0.3:a[13];a[15]=0;D[id]=a;sv();rk();closeSet();$("q").value=id;show(id);toast("اتحفظ ✅")}}
$("set").onclick=()=>openSet(false);
$("nx").onclick=()=>step(1);$("pv").onclick=()=>step(-1);
$("upd").onclick=async()=>{const b=$("upd");b.classList.add("spin");
  try{const h=await (await fetch(RAW+"?t="+Date.now(),{cache:"no-store"})).text();const m=h.match(/const VER=(\d+)/);
    if(m&&+m[1]>VER){localStorage.setItem("upd",JSON.stringify({v:+m[1],h}));toast("تم التحديث ✅");setTimeout(()=>location.reload(),700)}else toast("أنت على آخر إصدار ✔️")}
  catch(e){toast("مفيش اتصال بالإنترنت")}b.classList.remove("spin")};
})();</script></body></html>
